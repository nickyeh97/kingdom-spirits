<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fdf6e3; }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; font: 16px/1.5 system-ui, sans-serif; color: #5b4a2e; }
    #bar { width: 60%; height: 8px; margin-top: 12px; overflow: hidden; border-radius: 4px; background: #eadfc8; }
    #fill { width: 0; height: 100%; background: #e0a84a; transition: width 0.3s; }
    #hint { min-height: 1.5em; margin-top: 10px; font-size: 13px; color: #8a7a5c; }
    #paw { font-size: 40px; animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    #load-time { position: fixed; right: 8px; bottom: 8px; font: 12px system-ui, sans-serif; color: #8a7a5c; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div id="paw" aria-hidden="true">🐑</div>
    <div id="msg">靈獸準備中…</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="hint"></div>
  </div>
  <script>
    // 平台以 #at=<access_token>&child=<child_id> 開啟遊戲（GDD §6.2）：
    // 先暫存給 C# 取走，並立刻清掉網址列，避免 token 留在瀏覽紀錄或被複製分享
    window.__sbAuthFragment = location.hash.slice(1);
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    // 遊戲已經載入後才在網址列改 #…（例如補上 #demo）：瀏覽器不會重新載入，遊戲讀不到新的片段 → 自動重新載入
    window.addEventListener('hashchange', function () { location.reload(); });
    var loadStart = performance.now();
    // 遊戲畫面的「回到牧區平台」：沒有上一頁時開這個網址
    window.__sbPlatformUrl = 'https://kingdom-little-leaders.vercel.app/';
  </script>
  <script>
    // 載入中輪流顯示三隻靈獸（還不知道孩子選的是哪一隻）
    var pawIndex = 0;
    var pawTimer = setInterval(function () {
      pawIndex = (pawIndex + 1) % 3;
      document.querySelector('#paw').textContent = ['🐑', '🕊️', '🦁'][pawIndex];
    }, 1600);
    // 第一次開啟要下載約 13 MB：超過 12 秒還沒好，告訴家長是網路慢、不是壞掉（第二次開會快很多）
    var slowHint = setTimeout(function () {
      document.querySelector('#hint').textContent = '網路比較慢，再等一下下就好（第二次開啟會快很多）';
    }, 12000);
  </script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(document.querySelector('#unity-canvas'), {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      // PlayerPrefs（記住渲染模式）存在瀏覽器的 IndexedDB：讓 Unity 自動同步，不用舊的手動同步（Console 的棄用警告）
      autoSyncPersistentDataPath: true
    }, function (progress) {
      document.querySelector('#fill').style.width = (100 * progress) + '%';
    }).then(function () {
      clearTimeout(slowHint); clearInterval(pawTimer);
      document.querySelector('#loading').remove();
      // G0 驗收用：顯示首次載入秒數（目標 4G ≤ 10 秒）
      var el = document.createElement('div');
      el.id = 'load-time';
      el.textContent = ((performance.now() - loadStart) / 1000).toFixed(1) + ' s';
      document.body.appendChild(el);
    }).catch(function (err) {
      clearTimeout(slowHint); clearInterval(pawTimer);
      document.querySelector('#msg').textContent = '載入失敗，請從平台重新開啟';
      document.querySelector('#hint').textContent = '可以先確認網路，再回到牧區平台點一次「小領袖靈獸」';
      console.error(err);
    });
  </script>
</body>
</html>
